# Optional AI route: deploy the service first. Keep before the static route.
handle /model-lab/api/assistant/* {
    request_body {
        max_size 48KB
    }
    uri strip_prefix /model-lab
    reverse_proxy 127.0.0.1:8340 {
        header_up Host xiamimate.com
    }
}

# Place before the host's catch-all handle.
@modelLabRoot path /model-lab
redir @modelLabRoot /model-lab/ 308
handle_path /model-lab/* {
    root * /srv/xiamimate/model-lab/current
    encode zstd gzip
    header Cache-Control "no-cache"
    try_files {path} {path}/index.html
    file_server
}
